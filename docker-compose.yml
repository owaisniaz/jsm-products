services:
  db:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - jsm-product:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  jsm-product: