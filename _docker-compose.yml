
services:
  client:
    build:
      context: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
    tmpfs:
      - /app/node_modules:mode=1777
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://db:27017/jsm-product
    volumes:
      - ./backend:/app
    tmpfs:
      - /app/node_modules:mode=1777
    depends_on:
      - db

  db:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
