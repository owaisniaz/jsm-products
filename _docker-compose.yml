services:
  backend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      MONGODB_URI: mongodb://db:27017/jsm-product
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install --legacy-peer-deps && npm run start:dev"

  client:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  db:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - jsm-product:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  backend_node_modules:
  client_node_modules:
  jsm-product: